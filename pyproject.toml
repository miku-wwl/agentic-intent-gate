[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agentic-intent-gate"
version = "0.1.0"
description = "Local, strictly validated planning previews"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<0.29",
  "jsonschema>=4.23,<5",
  "uvicorn>=0.34,<1",
]

[project.scripts]
aig-plans = "agentic_intent_gate.main:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_intent_gate"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "agentic_intent_gate/schemas"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -m 'not live'"
markers = ["live: opt-in real phi-4-mini integration; no mock substitution"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
