[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "agentic-intent-gate"
version = "0.3.0"
description = "Reliable, approval-gated AI agent runtime with configurable model providers"
requires-python = ">=3.13,<3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<0.29",
  "jsonschema>=4.23,<5",
  "python-dotenv>=1,<2",
  "uvicorn>=0.34,<1",
]

[project.scripts]
aig-plans = "agentic_intent_gate.main:main"

[dependency-groups]
dev = [
    "playwright>=1.50,<2",
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_intent_gate"]

[tool.hatch.build.targets.sdist]
include = [
  "/src", "/schemas", "/tests", "/examples", "/scripts", "/docs",
  "/README.md", "/AGENTS.md", "/.env.example", "/LICENSE", "/pyproject.toml", "/uv.lock",
]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "agentic_intent_gate/schemas"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -m 'not live'"
markers = [
  "live: opt-in real phi-4-mini integration; no mock substitution",
  "browser: real browser automation using an installed browser",
  "frontend: deterministic UI behavior with controlled HTTP responses",
  "live_browser: opt-in real application, browser and phi-4-mini flow",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
